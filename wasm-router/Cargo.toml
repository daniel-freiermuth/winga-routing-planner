[package]
name = "wasm-router"
version = "0.1.0"
edition = "2024"
description = "Isochrone routing algorithm compiled to WebAssembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
