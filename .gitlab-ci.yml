pages:
  image: node:24-bookworm
  stage: deploy
  before_script:
    # Rust toolchain + wasm-pack
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
    - . "$HOME/.cargo/env"
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-pack
    # pnpm
    - corepack enable
    - corepack prepare pnpm@12 --activate
    - pnpm install --ignore-scripts
  script:
    - pnpm -C windy-lib/ts build
    - pnpm build:wasm
    - cd webapp/public/data && for f in *.bin.gz; do cp --remove-destination "$(readlink "$f")" "$f"; done && cd ../../..
    - pnpm build:webapp
    - mv dist/webapp public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
