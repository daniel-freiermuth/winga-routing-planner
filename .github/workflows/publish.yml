# Release pipeline: on a v* tag, builds and tests the plugin, then publishes it to npm with provenance.
name: Publish
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install
      - run: pnpm -C windy-lib/ts build
      - run: pnpm build:wasm
      - run: pnpm build
      - run: pnpm test
      - run: pnpm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
