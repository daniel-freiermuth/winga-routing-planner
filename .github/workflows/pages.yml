# Builds the webapp (including the WASM router) and deploys it to GitHub Pages from main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts
      - run: pnpm -C windy-lib/ts build
      - run: pnpm build:wasm
      - name: Resolve data symlinks
        run: |
          cd webapp/public/data
          for f in *.bin.gz; do cp --remove-destination "$(readlink "$f")" "$f"; done
      - run: pnpm build:webapp
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/webapp
      - uses: actions/deploy-pages@v5
        id: deploy
