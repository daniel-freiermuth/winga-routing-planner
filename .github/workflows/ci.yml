# CI gate: runs the full Rust + TypeScript check suite (pnpm check:all) on every push and PR to main.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --ignore-scripts
      - run: pnpm check:all
